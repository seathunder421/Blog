<!DOCTYPE html>
<html>
<head><title>图片库</title></head>
<body>
    <h2>上传的图片</h2>
    {% for img in images %}
        <div style="display:inline-block; margin:10px;">
            <img src="{{ url_for('static', filename='uploads/' + img) }}" width="200"><br>
            {{ img }}
        </div>
    {% endfor %}
    <br><br>
    <a href="{{ url_for('upload') }}">返回上传</a>
</body>
</html>
