<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备登录记录 - SeaThunder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .debug-panel {
            padding: 20px 30px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            margin: 20px 30px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.8;
        }

        .debug-panel strong {
            color: #856404;
        }

        .debug-item {
            margin: 5px 0;
            padding: 5px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .debug-item:last-child {
            border-bottom: none;
        }

        .table-container {
            padding: 30px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .action-bar h2 {
            color: #333;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-warning {
            background: #ffc107;
            color: #000;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
            font-size: 13px;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .loading {
            display: inline-block;
            color: #007bff;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 22px;
            }

            .table-container {
                padding: 15px;
            }

            .debug-panel {
                margin: 15px;
                padding: 15px;
                font-size: 12px;
            }

            table {
                font-size: 11px;
            }

            th, td {
                padding: 8px 6px;
            }

            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ 设备访问记录</h1>
            <p>https://seathunder.online/parameters</p>
        </div>

        <div class="debug-panel">
            <strong>🔍 本次访问实时检测：</strong>
            <div class="debug-item">
                <strong>网络类型：</strong> <span id="debugNetwork">检测中...</span>
            </div>
            <div class="debug-item">
                <strong>设备：</strong> <span id="debugDevice">检测中...</span>
            </div>
            <div class="debug-item">
                <strong>系统：</strong> <span id="debugOS">检测中...</span>
            </div>
            <div class="debug-item">
                <strong>浏览器：</strong> <span id="debugBrowser">检测中...</span>
            </div>
            <div class="debug-item">
                <strong>IP地址：</strong> <span id="debugIP" class="loading">正在获取...</span>
            </div>
            <div class="debug-item">
                <strong>IP来源：</strong> <span id="debugIPSource">-</span>
            </div>
            <div class="debug-item">
                <strong>访问时间：</strong> <span id="debugTime">-</span>
            </div>
            <div class="debug-item" style="font-size: 11px; color: #666; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.1);">
                <strong>💡 说明：</strong> 如果显示"未知"，说明浏览器开启了桌面模式或UA被伪装。建议关闭"桌面版网站"后重试。
            </div>
            <div class="debug-item" style="font-size: 11px; color: #666;">
                <strong>User Agent：</strong><br>
                <span id="debugUA">-</span>
            </div>
        </div>

        <div class="table-container">
            <div class="action-bar">
                <h2>📝 访问历史记录 (<span id="recordCount">0</span>条)</h2>
                <div class="button-group">
                    <button class="btn btn-success" onclick="forceRefreshIP()">🔄 强制刷新IP</button>
                    <button class="btn btn-primary" onclick="addManualRecord()">➕ 手动添加记录</button>
                    <button class="btn btn-warning" onclick="clearCache()">🧹 清除缓存</button>
                    <button class="btn btn-danger" onclick="clearAllRecords()">🗑️ 清空记录</button>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="visitTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>登录时间</th>
                            <th>IP地址</th>
                            <th>网络类型</th>
                            <th>操作系统</th>
                            <th>浏览器</th>
                            <th>设备类型</th>
                            <th>IP来源</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 检测网络类型
        function getNetworkType() {
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            
            if (!connection) {
                return '未知';
            }
            
            // 移动数据检测
            if (connection.type === 'cellular') {
                if (connection.effectiveType === '4g') return '移动数据 (4G)';
                if (connection.effectiveType === '3g') return '移动数据 (3G)';
                if (connection.effectiveType === '2g') return '移动数据 (2G)';
                if (connection.effectiveType === 'slow-2g') return '移动数据 (2G慢)';
                return '移动数据';
            }
            
            // 其他网络类型
            if (connection.type === 'wifi') return 'WiFi';
            if (connection.type === 'ethernet') return '有线网络';
            if (connection.type === 'none') return '离线';
            
            // 如果只有effectiveType
            if (connection.effectiveType) {
                if (connection.effectiveType === '4g') return '移动数据 (4G)';
                if (connection.effectiveType === '3g') return '移动数据 (3G)';
                if (connection.effectiveType === '2g') return '移动数据 (2G)';
            }
            
            return '未知';
        }

        // 精确的设备检测（严格模式：检测不准确时显示"未知"）
        function detectDevice() {
            const ua = navigator.userAgent;
            let os = '未知';
            let browser = '未知';
            let device = '未知';
            
            // 先检测操作系统和设备
            let detectedOS = '未知';
            let detectedDevice = '未知';
            
            // iPhone
            if (/iPhone/i.test(ua) && /Mobile/i.test(ua)) {
                detectedOS = 'iOS';
                detectedDevice = '手机';
                const iosVersion = ua.match(/OS ([\d_]+)/);
                if (iosVersion) detectedOS = `iOS ${iosVersion[1].replace(/_/g, '.')}`;
            }
            // iPad
            else if (/iPad/i.test(ua)) {
                detectedOS = 'iPadOS';
                detectedDevice = '平板';
            }
            // Android 手机
            else if (/Android/i.test(ua) && /Mobile/i.test(ua)) {
                const androidVersion = ua.match(/Android ([\d.]+)/);
                detectedOS = androidVersion ? `Android ${androidVersion[1]}` : 'Android';
                detectedDevice = '手机';
            }
            // Android 平板
            else if (/Android/i.test(ua) && !/Mobile/i.test(ua)) {
                const androidVersion = ua.match(/Android ([\d.]+)/);
                detectedOS = androidVersion ? `Android ${androidVersion[1]}` : 'Android';
                detectedDevice = '平板';
            }
            // Windows
            else if (/Windows NT/i.test(ua) && !/Mobile|Android|iPhone|iPad/i.test(ua)) {
                if (/Windows NT 10\.0/i.test(ua)) detectedOS = 'Windows 10/11';
                else if (/Windows NT 6\.[1-3]/i.test(ua)) detectedOS = 'Windows 7/8';
                else detectedOS = 'Windows';
                detectedDevice = '桌面';
            }
            // macOS
            else if (/Macintosh|Mac OS X/i.test(ua) && !/Mobile|Android|iPhone|iPad/i.test(ua)) {
                const macVersion = ua.match(/Mac OS X ([\d_]+)/);
                detectedOS = macVersion ? `macOS ${macVersion[1].replace(/_/g, '.')}` : 'macOS';
                detectedDevice = '桌面';
            }
            // Linux
            else if (/Linux/i.test(ua) && !/Android/i.test(ua)) {
                detectedOS = 'Linux';
                detectedDevice = '桌面';
            }

            // 浏览器检测
            let detectedBrowser = '未知';
            if (/MicroMessenger/i.test(ua)) {
                const v = ua.match(/MicroMessenger\/([\d.]+)/);
                detectedBrowser = v ? `微信 ${v[1]}` : '微信';
            } else if (/QQBrowser/i.test(ua)) {
                detectedBrowser = 'QQ浏览器';
            } else if (/UCBrowser/i.test(ua)) {
                detectedBrowser = 'UC浏览器';
            } else if (/Edg\//i.test(ua)) {
                const v = ua.match(/Edg\/([\d.]+)/);
                detectedBrowser = v ? `Edge ${v[1].split('.')[0]}` : 'Edge';
            } else if (/SamsungBrowser/i.test(ua)) {
                detectedBrowser = 'Samsung';
            } else if (/OPR\//i.test(ua)) {
                detectedBrowser = 'Opera';
            } else if (/Firefox\//i.test(ua)) {
                const v = ua.match(/Firefox\/([\d.]+)/);
                detectedBrowser = v ? `Firefox ${v[1].split('.')[0]}` : 'Firefox';
            } else if (/Chrome\//i.test(ua) && !/Edg/i.test(ua)) {
                const v = ua.match(/Chrome\/([\d.]+)/);
                detectedBrowser = v ? `Chrome ${v[1].split('.')[0]}` : 'Chrome';
            } else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) {
                const v = ua.match(/Version\/([\d.]+)/);
                detectedBrowser = v ? `Safari ${v[1].split('.')[0]}` : 'Safari';
            }

            // 返回检测结果（不做任何修正，保持原值或"未知"）
            return { 
                os: detectedOS, 
                browser: detectedBrowser, 
                device: detectedDevice, 
                ua 
            };
        }
        
        // 交叉验证：如果网络类型与设备类型矛盾，标记为"未知"
        function validateDeviceInfo(deviceInfo, networkType) {
            // 如果网络类型是移动数据，但设备显示为桌面，说明有问题
            if (networkType.includes('移动数据') && deviceInfo.device === '桌面') {
                return {
                    os: '未知 (UA伪装)',
                    browser: deviceInfo.browser, // 浏览器信息可能是准确的
                    device: '未知 (桌面模式)',
                    ua: deviceInfo.ua
                };
            }
            
            // 如果网络类型未知，但UA显示Mac/Windows，可能是伪装
            if (networkType === '未知' && deviceInfo.device === '桌面' && navigator.maxTouchPoints > 0) {
                return {
                    os: '未知 (可能伪装)',
                    browser: deviceInfo.browser,
                    device: '未知',
                    ua: deviceInfo.ua
                };
            }
            
            // 其他情况返回原值
            return deviceInfo;
        }

        // 获取IP地址 - 强制不使用缓存
        async function getIPAddress() {
            const timestamp = new Date().getTime();
            const services = [
                { url: `https://api.ipify.org?format=json&t=${timestamp}`, key: 'ip', name: 'ipify.org' },
                { url: `https://api64.ipify.org?format=json&t=${timestamp}`, key: 'ip', name: 'ipify.org (v6)' },
                { url: `https://api.ip.sb/jsonip?t=${timestamp}`, key: 'ip', name: 'ip.sb' },
                { url: `https://ipapi.co/json/?t=${timestamp}`, key: 'ip', name: 'ipapi.co' },
            ];

            for (let service of services) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    
                    const response = await fetch(service.url, { 
                        signal: controller.signal,
                        cache: 'no-store',
                        headers: {
                            'Cache-Control': 'no-cache, no-store, must-revalidate',
                            'Pragma': 'no-cache',
                            'Expires': '0'
                        }
                    });
                    
                    clearTimeout(timeoutId);
                    const data = await response.json();
                    const ip = data[service.key] || data.query;
                    
                    if (ip && ip !== 'undefined' && ip !== 'null') {
                        return { ip, source: service.name };
                    }
                } catch (e) {
                    console.log(`Failed: ${service.name}`, e.message);
                    continue;
                }
            }
            
            return { ip: '未知', source: '获取失败' };
        }

        // 存储管理
        let visitRecords = [];
        
        function loadVisitRecords() {
            try {
                const saved = localStorage.getItem('visitRecords');
                if (saved) {
                    visitRecords = JSON.parse(saved);
                }
            } catch (e) {
                console.log('Storage error:', e);
            }
            return visitRecords;
        }

        function saveVisitRecords(records) {
            visitRecords = records;
            try {
                localStorage.setItem('visitRecords', JSON.stringify(records));
            } catch (e) {
                console.log('Save error:', e);
            }
        }

        // 更新调试信息
        function updateDebugInfo(deviceInfo, networkType, ipData, time) {
            document.getElementById('debugDevice').textContent = deviceInfo.device;
            document.getElementById('debugOS').textContent = deviceInfo.os;
            document.getElementById('debugBrowser').textContent = deviceInfo.browser;
            document.getElementById('debugNetwork').textContent = networkType;
            document.getElementById('debugIP').textContent = ipData.ip;
            document.getElementById('debugIP').className = ipData.ip === '获取失败' ? 'loading' : '';
            document.getElementById('debugIPSource').textContent = ipData.source;
            document.getElementById('debugTime').textContent = time;
            document.getElementById('debugUA').textContent = deviceInfo.ua;
        }

        // 显示所有记录
        function displayAllRecords() {
            const records = loadVisitRecords();
            const tableBody = document.getElementById('tableBody');
            document.getElementById('recordCount').textContent = records.length;
            tableBody.innerHTML = '';
            
            if (records.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 60px 20px; color: #999;">
                            <div style="font-size: 48px; margin-bottom: 15px;">📭</div>
                            <div style="font-size: 16px;">暂无访问记录</div>
                            <div style="font-size: 14px; margin-top: 8px;">点击"手动添加记录"或刷新页面</div>
                        </td>
                    </tr>
                `;
                return;
            }
            
            for (let i = records.length - 1; i >= 0; i--) {
                const record = records[i];
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${record.id}</strong></td>
                    <td style="white-space: nowrap; font-size: 12px;">${record.time}</td>
                    <td><code style="background: #e3f2fd; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #0277bd; font-weight: bold;">${record.ip}</code></td>
                    <td><span class="badge badge-info">${record.network}</span></td>
                    <td><strong>${record.os}</strong></td>
                    <td><strong>${record.browser}</strong></td>
                    <td><span class="badge badge-success">${record.device}</span></td>
                    <td style="font-size: 11px; color: #666;">${record.ipSource}</td>
                `;
                tableBody.appendChild(row);
            }
        }

        // 添加新记录
        async function addNewVisitRecord() {
            let deviceInfo = detectDevice();
            const networkType = getNetworkType();
            
            // 交叉验证：如果网络类型与设备信息矛盾，标记为"未知"
            deviceInfo = validateDeviceInfo(deviceInfo, networkType);
            
            const ipData = await getIPAddress();
            const time = new Date().toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            updateDebugInfo(deviceInfo, networkType, ipData, time);

            const records = loadVisitRecords();
            const newId = records.length > 0 ? Math.max(...records.map(r => r.id)) + 1 : 1;
            
            const newRecord = {
                id: newId,
                time: time,
                ip: ipData.ip,
                network: networkType,
                os: deviceInfo.os,
                browser: deviceInfo.browser,
                device: deviceInfo.device,
                ipSource: ipData.source,
                timestamp: Date.now(),
                ua: deviceInfo.ua
            };
            
            records.push(newRecord);
            saveVisitRecords(records);
            displayAllRecords();
        }

        // 强制刷新IP
        async function forceRefreshIP() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '🔄 获取中...';
            
            await addNewVisitRecord();
            
            btn.disabled = false;
            btn.textContent = '🔄 强制刷新IP';
            alert('✅ 已添加新的访问记录！');
        }

        // 手动添加记录
        async function addManualRecord() {
            if (confirm('🤔 确定手动添加一条新的访问记录吗？\n\n这将重新检测设备信息和IP地址。')) {
                const btn = event.target;
                btn.disabled = true;
                btn.textContent = '⏳ 添加中...';
                
                await addNewVisitRecord();
                
                btn.disabled = false;
                btn.textContent = '➕ 手动添加记录';
                alert('✅ 新记录已添加！');
            }
        }

        // 清除缓存
        function clearCache() {
            if (confirm('🧹 这将清除浏览器缓存并刷新页面。\n\n访问记录不会被删除。\n\n是否继续？')) {
                if ('caches' in window) {
                    caches.keys().then(names => {
                        names.forEach(name => caches.delete(name));
                    });
                }
                window.location.reload(true);
            }
        }

        // 清空所有记录
        function clearAllRecords() {
            if (confirm('⚠️ 确定要清空所有访问记录吗？\n\n此操作不可恢复！')) {
                try {
                    localStorage.removeItem('visitRecords');
                } catch (e) {}
                visitRecords = [];
                displayAllRecords();
                alert('✅ 所有记录已清空！');
            }
        }

        // 初始化
        async function initialize() {
            displayAllRecords();
            await addNewVisitRecord();
        }

        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
